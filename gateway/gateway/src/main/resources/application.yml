server:
  port: 8080


spring:
  main:
    web-application-type: reactive

  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ac3dag36g581b1d59f84g2g9fa5g561hh7fa3d7c

  cloud:
    gateway:
      routes:
        - id: compra
          uri: http://localhost:8081
          predicates:
            - Path=/api/compras/**

        - id: inventario
          uri: http://localhost:8082
          predicates:
            - Path=/api/inventario/**

        - id: clientes
          uri: http://localhost:8083
          predicates:
            - Path=/api/clientes/**

        - id: pagos
          uri: http://localhost:8084
          predicates:
            - Path=/api/pagos/**

        - id: producto
          uri: http://localhost:8085
          predicates:
            - Path=/api/producto/**

        - id: auth
          uri: http://localhost:8086
          predicates:
            - Path=/api/auth/**



