spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: compra-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/compras,/api/compras/**

        - id: inventario-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/inventario,/api/inventario/**

server:
  port: 8080