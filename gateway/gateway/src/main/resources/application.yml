server:
  port: 9090


spring:
  main:
    web-application-type: reactive

  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: compra
          uri: http://localhost:9091
          predicates:
            - Path=/api/compras/**

        - id: inventario
          uri: http://localhost:9092
          predicates:
            - Path=/api/inventario/**

        - id: clientes
          uri: http://localhost:9093
          predicates:
            - Path=/api/clientes/**

        - id: pagos
          uri: http://localhost:9094
          predicates:
            - Path=/api/pagos/**

        - id: producto
          uri: http://localhost:9095
          predicates:
            - Path=/api/producto/**

        - id: auth
          uri: http://localhost:9096
          predicates:
            - Path=/api/auth/**



