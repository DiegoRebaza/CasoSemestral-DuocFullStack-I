version: "3.9"

x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: docker
  JWT_SECRET: "8d5hg01g8yt91p6tczc5auxkao4u8og9m9e02x7lv64q4ref97ahh2il5sgsfck3h4h94sj9wlardkeh"

services:

  mysql:
    image: mysql:8.0
    container_name: bravatta-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bravatta-net

  auth:
    build: ./auth
    container_name: auth
    ports:
      - "9080:9080"
    environment: *common-env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bravatta-net

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment: *common-env
    depends_on:
      - auth
    networks:
      - bravatta-net

  clientes:
    build: ./clientes
    container_name: clientes
    ports:
      - "9081:9081"
    environment: *common-env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bravatta-net

  compra:
    build: ./compra
    container_name: compra
    ports:
      - "9082:9082"
    environment: *common-env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bravatta-net

  inventario:
    build: ./inventario
    container_name: inventario
    ports:
      - "9083:9083"
    environment: *common-env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bravatta-net

  pagos:
    build: ./pagos
    container_name: pagos
    ports:
      - "9084:9084"
    environment: *common-env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bravatta-net

  producto:
    build: ./producto
    container_name: producto
    ports:
      - "9085:9085"
    environment: *common-env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bravatta-net

  recomendaciones:
    build: ./recomendaciones
    container_name: recomendaciones
    ports:
      - "9086:9086"
    environment: *common-env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bravatta-net

  posventa:
    build: ./posventa
    container_name: posventa
    ports:
      - "9087:9087"
    environment: *common-env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bravatta-net

  envios:
    build: ./envios
    container_name: envios
    ports:
      - "9088:9088"
    environment: *common-env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bravatta-net

  notificacion:
    build: ./notificacion
    container_name: notificacion
    ports:
      - "9089:9089"
    environment: *common-env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bravatta-net

  puntos:
    build: ./fidelizacion
    container_name: fidelizacion
    ports:
      - "9090:9090"
    environment: *common-env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bravatta-net

  delivery:
    build: ./delivery
    container_name: delivery
    ports:
      - "9100:9100"
    environment: *common-env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bravatta-net

networks:
  bravatta-net:
    driver: bridge

volumes:
  mysql_data: