spring.application.name=auth
server.port=9096

# Conexión a BD
spring.datasource.url=jdbc:mysql://localhost:3306/bd_users?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (clave nueva de 80 bytes, válida para HmacSHA512)
jwt.secret=8d5hg01g8yt91p6tczc5auxkao4u8og9m9e02x7lv64q4ref97ahh2il5sgsfck3h4h94sj9wlardkeh

# Logs (auth está 1 nivel de profundidad, como recomendaciones)
logging.file.name=../logs/auth.log
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
logging.pattern.file=%d{HH:mm:ss} %-5level %msg%n

# Swagger (lo activamos ahora aunque lo configuremos después)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html