spring.application.name=delivery
server.port=9100

# Conexión a BD local (Laragon, sin password en root)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_delivery
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate: no crea/borra tablas automáticamente (eso lo hace Liquibase)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# URL del Gateway: la usa WebClientConfig para llamar a otros microservicios
gateway.url=http://localhost:9090

jwt.secret=8d5hg01g8yt91p6tczc5auxkao4u8og9m9e02x7lv64q4ref97ahh2il5sgsfck3h4h94sj9wlardkeh

# Logging centralizado
logging.file.name=logs/delivery.log
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
logging.pattern.file=%d{HH:mm:ss} %-5level %msg%n

# Swagger/OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.